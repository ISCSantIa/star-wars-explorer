query GetCharacterDetail {
  allPeople(first: 100) {
    people {
      id
      name
    }
  }

  allFilms {
    films {
      id
      title
      director
      characterConnection {
        characters {
          id
        }
      }
      planetConnection {
        planets {
          id
          name
        }
      }
    }
  }
}