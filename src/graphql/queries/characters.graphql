query GetCharacters($first: Int, $after: String, $last: Int, $before: String) {
  allPeople(first: $first, after: $after, last: $last, before: $before) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    people {
      id
      name
    }
  }
}